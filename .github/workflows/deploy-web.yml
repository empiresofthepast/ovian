# Builds the two Angular front ends with the engine in WebAssembly and the baked 0 A.D. art, and deploys
# them as one Netlify site: the 3D diorama at /, the ledger at /ledger/ (same origin, so one login).
# See docs/deploy-netlify.md.
#
# Secrets:   NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# Variables: OVIAN_API_ORIGIN    where Netlify forwards /api/* (e.g. https://api.empires.ofthepast.org)
#            OVIAN_MQTT_URL      the broker for live updates, wss://... (a browser on https cannot use ws://)
#            OVIAN_MCP_URL       optional, the MCP server shown in Settings
name: deploy-web
on:
  push:
    branches: [main]
    paths: [web/**, engine/**, content/**, tools/zeroad/**, scripts/netlify_site.sh, .github/workflows/deploy-web.yml]
  workflow_dispatch:

concurrency: { group: deploy-web, cancel-in-progress: true }

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      # must equal the wasm-bindgen version pinned in engine/crates/ovian-wasm/Cargo.toml
      - run: cargo install wasm-bindgen-cli --version 0.2.95 --locked
      - run: |
          cd engine && cargo build -p ovian-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../out/engine --out-name ovian_engine target/wasm32-unknown-unknown/release/ovian_wasm.wasm
      - uses: actions/upload-artifact@v4
        with: { name: engine, path: out/engine }

  # 0 A.D. art for the diorama: a sparse checkout of 0 A.D., converted by tools/zeroad/bake.py. Cached until the
  # mapping, the converter or the content packs change.
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: web/projects/diorama/public/art
          key: art-${{ hashFiles('tools/zeroad/diorama.yaml', 'tools/zeroad/bake.py', 'tools/zeroad/zeroad.py', 'tools/zeroad/fetch.sh', 'content/**/pack.yaml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/zeroad/bake.sh
      # pre-gzipped meshes are for nginx; Netlify compresses on its own
      - run: tar --exclude='*.gz' -cf art.tar -C web/projects/diorama/public art
      - uses: actions/upload-artifact@v4
        with: { name: art, path: art.tar, retention-days: 3 }

  build:
    needs: [wasm, art]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: diorama, base: / }
          - { app: web, base: /ledger/ }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: engine, path: web/public/engine }
      - if: matrix.app == 'diorama'
        uses: actions/download-artifact@v4
        with: { name: art, path: . }
      - if: matrix.app == 'diorama'
        run: tar -xf art.tar -C web/projects/diorama/public && rm art.tar
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx ng build ${{ matrix.app }} --configuration production --base-href ${{ matrix.base }}
        working-directory: web
      - run: tar -cf ${{ matrix.app }}.tar -C web/dist/${{ matrix.app }}/browser .
      - uses: actions/upload-artifact@v4
        with: { name: 'site-${{ matrix.app }}', path: '${{ matrix.app }}.tar', retention-days: 3 }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: site-*, merge-multiple: true }
      - run: |
          mkdir -p site/ledger
          tar -xf diorama.tar -C site
          tar -xf web.tar -C site/ledger
      - name: Netlify settings (runtime config, API proxy, headers)
        env:
          API: ${{ vars.OVIAN_API_ORIGIN }}
          MQTT: ${{ vars.OVIAN_MQTT_URL }}
          MCP: ${{ vars.OVIAN_MCP_URL }}
          LEDGER: /ledger/
          DIORAMA: /
        run: |
          if [ -z "$API" ]; then
            echo "::warning::variable OVIAN_API_ORIGIN not set: built the site but will not deploy it"; exit 0
          fi
          ./scripts/netlify_site.sh site
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
          MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          if [ ! -f site/_redirects ]; then exit 0; fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$SITE" ]; then
            echo "::warning::secrets NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set: built the site but did not deploy it"; exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir site --site "$SITE" \
            --message "${GITHUB_SHA::7} $(printf '%s' "$MESSAGE" | head -1)"

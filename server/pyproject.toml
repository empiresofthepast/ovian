[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ovian-server"
version = "0.1.0"
description = "Ovian game server: REST API, persistence, game loop and plugin host. Rules live in the ovian-engine (Rust) package."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ovian-engine==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "pyjwt>=2.9",
  "pyyaml>=6",
  "pluggy>=1.5",
  "aiomqtt>=2.3,<3",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
ovian-server = "ovian_server.__main__:main"
ovian-hub = "ovian_hub.__main__:main"

# Third-party plugins register here, see docs/modding.md
[project.entry-points."ovian.plugins"]
beginner_protection = "ovian_server.plugins.beginner_protection"

[tool.hatch.build.targets.wheel]
packages = ["src/ovian_server", "src/ovian_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

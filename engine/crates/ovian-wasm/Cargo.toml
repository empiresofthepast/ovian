[package]
name = "ovian-wasm"
description = "WebAssembly bindings for the Ovian engine, used by the web client for previews and countdowns."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ovian-engine = { path = "../ovian-engine" }
serde.workspace = true
# Pinned exactly: the wasm-bindgen CLI used in the Docker build must match.
wasm-bindgen = "=0.2.95"
serde-wasm-bindgen = "0.6"

[workspace]
resolver = "2"
members = ["crates/ovian-engine", "crates/ovian-py", "crates/ovian-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ovian-game/ovian"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3

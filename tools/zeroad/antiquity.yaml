                0.33, 0.36, 0.39, 0.42, 0.45, 0.48, 0.51, 0.54, 0.57, 0.60]

village:
  base_production: { food: 12, wood: 6, stone: 6, metal: 6 }
  base_storage: 800
  field_slots: [woodline, woodline, woodline, woodline, quarry, quarry, quarry, quarry,
                mine, mine, mine, mine, field, field, field, field, field, field]
  center_slots: 47
  build_queue: 2
  # Sites open as the civic centre grows, like the 0 A.D. phases; from the City Phase on,
  # more construction jobs run at once. Architecture (University) adds one more.
  growth:
    building: civic_centre
    phases:
      - { id: village,    name: Village Phase,    level: 1,  center_slots: 8 }
      - { id: town,       name: Town Phase,       level: 5,  center_slots: 14 }
      - { id: city,       name: City Phase,       level: 10, center_slots: 20, build_queue: 3 }
      - { id: metropolis, name: Metropolis Phase, level: 20, center_slots: 20, build_queue: 4 }
      - { id: capital,    name: Capital Phase,    level: 40, center_slots: 20, build_queue: 5 }
      - { id: imperial,   name: Imperial Phase,   level: 60, center_slots: 20, build_queue: 6 }
    # From level 20, every 5 levels open 3 more sites: 23 at 20, 26 at 25 ... 47 at 60.
    extra_sites: { from: 20, every: 5, sites: 3 }
    # Every 10 levels of the civic centre open one more field of each kind (after the center sites).
    extra_fields: { every: 10, fields: [woodline, quarry, mine, field] }
  start:
    resources: { food: 750, wood: 750, stone: 750, metal: 750 }
    buildings:
      - { building: civic_centre, level: 1 }
      - { building: rally_point, level: 1 }

combat: { base_defense: 10, loss_exponent: 1.5 }

# Culture: temples and universities radiate influence to cities within `radius` tiles,
# fading with distance. In a battle, the side whose summed influence dominates the
# battlefield fights with up to `prestige_max` bonus (attack or defense).
culture: { radius: 12, prestige_max: 0.25, prestige_scale: 0.12 }

# A small tech tree, researched once per city. Prerequisites come first. `icon` names a
# 0 A.D. technology portrait (art/textures/ui/session/portraits/technologies/).
techs:
  - id: philosophy
    name: Philosophy
    description: Schools of thought that every later science builds on.
    building: university
    level: 1
    cost: { food: 300, wood: 300, stone: 400, metal: 200 }
    time: 3600
    icon: sibylline_books.png
  - id: architecture
    name: Architecture
    description: Master builders and cranes. One more construction job at a time.
    building: university
    level: 5
    after: [philosophy]
    build_queue: 1
    cost: { food: 800, wood: 1500, stone: 1500, metal: 500 }
    time: 10800
    icon: architecture.png
  - id: rites
    name: Sacred Rites
    description: Festivals and sacrifices bind the city to its gods.
    building: temple
    level: 1
    cost: { food: 400, wood: 200, stone: 300, metal: 100 }
    time: 3000
    icon: sacrifice.png
  - id: metallurgy
    name: Metallurgy
    description: Better forging. Unlocks the advanced infantry.
    building: university
    level: 3
    after: [philosophy]
    cost: { food: 500, wood: 600, stone: 300, metal: 900 }
    time: 7200
    icon: forging.png
  - id: horse_breeding
    name: Horse Breeding
    description: Stronger, faster mounts. Unlocks the advanced cavalry.
    building: university
    level: 5
    after: [philosophy]
    requires: { stable: 1 }
    cost: { food: 1200, wood: 500, stone: 300, metal: 600 }
    time: 9000
    icon: husbandry_horses.png
  - id: hero_cult
    name: Hero Cult
    description: Champions sworn to the gods. Unlocks the champion infantry.
    building: temple
    level: 5
    after: [rites]
    cost: { food: 1500, wood: 800, stone: 1200, metal: 1500 }
    time: 14400
    icon: laurel_wreath.png
  - id: strategy
    name: Strategy
    description: The art of command. Unlocks the champion cavalry, chariots and war elephants.
    building: university
    level: 10
    after: [metallurgy, horse_breeding, hero_cult]
    cost: { food: 3000, wood: 2000, stone: 2000, metal: 3500 }
    time: 21600
    icon: standard.png
  - id: political_thought
    name: Political Thought
    description: Citizens debate how they should be ruled. +3 contentment; unrest in this city grows 25% slower.
    building: university
    level: 3
    after: [philosophy]
    cost: { food: 600, wood: 400, stone: 600, metal: 400 }
    time: 7200
    icon: political_face.png
  - id: rhetoric
    name: Rhetoric
    description: Orators sway the assembly. The crowded-city penalty is halved, and agitators stir half as much unrest.
    building: university
    level: 6
    after: [political_thought]
    cost: { food: 1200, wood: 800, stone: 1000, metal: 800 }
    time: 10800
    icon: statue_face_stone.png
  - id: law_code
    name: Codified Law
    description: Written laws on bronze tablets. Unrest only gathers when contentment falls 5 points lower, and it calms 50% faster.
    building: university
    level: 8
    after: [political_thought]
    requires: { temple: 3 }
    cost: { food: 1500, wood: 1000, stone: 1800, metal: 1000 }
    time: 14400
    icon: scales.png
  - id: citizenship
    name: Citizenship
    description: Subjects become citizens with rights of their own. +5 contentment, tribute angers half as much, unrest grows 25% slower.
    building: university
    level: 12
    after: [rhetoric, law_code]
    requires: { civic_centre: 15 }
    cost: { food: 3000, wood: 2000, stone: 2500, metal: 2500 }
    time: 21600
    icon: patriotism.png
  - id: industry
    name: Industry
    description: Overseers, cranes and water-mills. Woodlines, quarries, mines and fields of this city can be raised to level 15.
    building: university
    level: 10
    after: [architecture]
    requires: { civic_centre: 15 }
    field_levels: 5
    cost: { food: 4000, wood: 4000, stone: 3000, metal: 3000 }
    time: 21600
    icon: wheelbarrow_empty.png
  - id: drill
    name: Drill
    description: Daily drill turns recruits into advanced soldiers. +10% attack and defense for the troops of this city.
    building: barracks
    level: 5
    cost: { food: 1500, wood: 1000, stone: 500, metal: 1500 }
    time: 7200
    icon: armor_leather.png
  - id: veterans
    name: Veterans
    description: Seasoned elite soldiers. A further +10% attack and defense for the troops of this city.
    building: fortress
    level: 3
    after: [drill]
    cost: { food: 3000, wood: 2000, stone: 1000, metal: 3000 }
    time: 14400
    icon: armor_corinthian.png
  - id: civil_servants
    name: Civil Servants
    description: Every citizen is enrolled and drilled. When the city is attacked, each citizen fights as one of your people's spearmen; they return to their trades after the battle.
    building: fortress
    level: 10
    after: [veterans]
    requires: { civic_centre: 15 }
    cost: { food: 40000, wood: 30000, stone: 30000, metal: 40000 }
    time: 86400
    icon: patriotism.png

extensions:
  beginner_protection_hours: 72
  # Pulling a building down frees its site and gives back `refund` of what all its levels cost.
  # The city centre, great buildings and the wonder always stay; `keep` lists more.
  demolish: { refund: 0.5, keep: [] }
  # With the upkeep resource at zero and still falling short, troops starve: every `tick_hours` (game hours)
  # the cheapest die first, until their upkeep covers `share` of the deficit, until the city feeds itself again.
  starvation: { tick_hours: 1, share: 0.25 }
  # After `wins` battles won in a row, a city submits to the winner and pays `tribute` of its production.
  # In return a vassal gets the overlord's protection: `benefits` (production share, defense bonus, contentment, trade speed).
  # Each new overlord opens a foreign quarter in its vassal: an embassy site (which only the overlord can build, and pays for)
  # and `exchange_slots` free sites for foreign buildings. Every level of foreign exchange cuts the tribute by `exchange_relief`.
  # Buildings show the architecture of the power that ruled when they were founded; the embassy of a lost overlord becomes `ruin`.
  # The overlord also gets `overlord_slots` sites for the `overlord` buildings (cultural exchange, garrison), which it builds and pays for.
  embassies: { building: embassy, ruin: ruin, exchange: exchange, exchange_slots: 1, exchange_relief: 0.03,
               overlord: [cultural_exchange, garrison], overlord_slots: 2,
               # with no governor in the city, an embassy this high lets the overlord build there as in their own city
               steward_level: 6 }
  # The overlord sets taxes between `taxes.min` and `taxes.max`; above the usual tribute they anger the city,
  # `per_point` per percentage point, times 1 + distance / `taxes.distance`, so remote cities grow restless first.
  # A city may also swear fealty of its own will: it pays `voluntary.tribute` and may renounce it at any time.
  submission: { wins: 5, tribute: 0.1, kinds: [attack, raid], benefits: { production: 0.05, defense: 0.15, contentment: 5, trade_speed: 0.5 }, voluntary: { tribute: 0.05 }, taxes: { min: 0, max: 0.3, per_point: 1, distance: 15 } }

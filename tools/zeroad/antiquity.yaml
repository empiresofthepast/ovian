# Converter settings: how 0 A.D. data becomes the Ovian "antiquity" pack.
# Run tools/zeroad/convert.sh after changing anything here.

source:
  repo: https://gitea.wildfiregames.com/0ad/0ad.git
  commit: cedd5e89a0ebdaec42ea938a51ef7c89d6ad7645

pack:
  id: antiquity
  name: Antiquity
  version: 0.1.0
  description: >-
    Fifteen civilizations of 0 A.D. Their units, costs, armour and speeds are
    converted from the 0 A.D. simulation data.
  world: { speed: 1, width: 121, height: 121, seed: 1177, generator: grid }

# 0 A.D. resource ids are used as-is; food pays upkeep, as in 0 A.D.
resources:
  - { id: food,  name: Food, upkeep: true }
  - { id: wood,  name: Wood }
  - { id: stone, name: Stone }
  - { id: metal, name: Metal }

# Civilizations, in the order players see them. Remove one to leave it out.
civs: [athen, spart, mace, ptol, sele, rome, cart, iber, gaul, brit, germ, achae, maur, kush, han]

# How 0 A.D. numbers become Ovian numbers. See docs/antiquity.md.
scale:
  cost: 3.5              # resources: 0 A.D. cost x this
  time: 75               # seconds: 0 A.D. train time x this
  speed: 0.65            # tiles/hour per 0 A.D. walk speed (m/s)
  carry: 5               # loot per point of gather capacity
  carry_default: { infantry: 40, cavalry: 80 }  # for units that cannot gather
  power: 40              # median basic infantry attack after scaling
  range_bonus: 0.01      # +1% attack and defense per metre of range, up to 80 m
  upkeep: { base: 1, cavalry: 1, champion: 1, elephant: 2 }
  # Ovian keeps attack and defense apart; 0 A.D. classes decide who is better at which.
  roles:
    Ranged:    { attack: 0.8,  defense: 1.25 }   # shoot from walls and behind the line
    Swordsman: { attack: 1.2,  defense: 0.9 }
    Axeman:    { attack: 1.2,  defense: 0.9 }
    Maceman:   { attack: 1.25, defense: 0.85 }
    Spearman:  { attack: 0.9,  defense: 1.1 }
    Pikeman:   { attack: 0.7,  defense: 1.3 }
    Elephant:  { attack: 1.1,  defense: 0.9 }

# How many units of each kind a civ gets, strongest kept. Heroes, healers,
# siege engines, ships and support units are never converted.
roster:
  infantry: 5
  cavalry: 3
  champions: 2
  # technologies by position within its building, cheapest first (see techs below)
  techs:
    barracks: [[], [], [metallurgy], [metallurgy], [metallurgy]]
    stable: [[], [horse_breeding], [horse_breeding]]
    fortress: { foot: [hero_cult], mounted: [strategy] }
  # requirements by position within its building, cheapest first
  tiers:
    barracks: [0, 0, 3, 5, 8]
    stable: [0, 3, 6]
    fortress: [1, 5]
  # Units every people has besides its 0 A.D. roster: `<civ>_<id>`, looks borrowed from `zeroad` (units/<civ>/...).
  # Settlers (three times a ver sacrum): sent with an army against a barbarian camp, one turns it into a colony.
  extra:
    - { id: settler, zeroad: support_female_citizen, name: Settlers, building: civic_centre, class: infantry,
        description: "Families ready to found a city. Send them with an army against a barbarian camp: when the camp falls, it becomes your colony, with all its stores. They do not fight.",
        cost: { food: 24000, wood: 18000, stone: 12000, metal: 9000 }, upkeep: 3, time: 21600, attack: 0,
        defense: { infantry: 5, cavalry: 5 }, speed: 4, carry: 0, requires: { civic_centre: 10 } }

# Buildings. `zeroad` names the 0 A.D. structure (per civ) whose cost mix and
# looks are borrowed; `total` is the level 1 cost before the mix is applied.
buildings:
  - id: woodline
    name: Woodline
    description: Lumberjacks fell the forest at the edge of the village.
    slot: field
    max_level: 10
    cost: { total: 250, mix: { food: 60, wood: 40, stone: 100, metal: 50 }, factor: 1.67 }
    time: { base: 260, factor: 1.6 }
    population: 2
    effects: { production: { resource: wood, curve: { base: 8, factor: 1.35, round: 1 } } }
  - id: quarry
    name: Quarry
    description: Stone cut from the hillside.
    slot: field
    max_level: 10
    cost: { total: 250, mix: { food: 50, wood: 80, stone: 40, metal: 80 }, factor: 1.67 }
    time: { base: 220, factor: 1.6 }
    population: 2
    effects: { production: { resource: stone, curve: { base: 8, factor: 1.35, round: 1 } } }
  - id: mine
    name: Mine
    description: Ore dug from the metal seam.
    slot: field
    max_level: 10
    cost: { total: 270, mix: { food: 60, wood: 100, stone: 80, metal: 30 }, factor: 1.67 }
    time: { base: 450, factor: 1.6 }
    population: 3
    effects: { production: { resource: metal, curve: { base: 8, factor: 1.35, round: 1 } } }
  - id: field
    name: Field
    description: Grain fields that feed the people and the army.
    slot: field
    max_level: 10
    zeroad: field
    cost: { total: 250, factor: 1.67 }
    time: { base: 150, factor: 1.6 }
    population: 0
    effects: { production: { resource: food, curve: { base: 8, factor: 1.35, round: 1 } } }

  - id: civic_centre
    name: Civic Centre
    description: Heart of the polis. Each level speeds up construction. Levels 5 and 10 open building sites; levels 10, 20, 40 and 60 add construction jobs.
    slot: center
    max_level: 60
    zeroad: civil_centre
    cost: { total: 190, factor: 1.15 }     # gentle, so level 60 stays within reach
    time: { base: 600, factor: 1.2 }
    population: 2
    effects: { build_speed: { base: 1.0, factor: 0.965 } }
  - id: storehouse
    name: Storehouse
    description: Stores wood, stone and metal.
    slot: center
    max_level: 20
    unique: false
    requires: { civic_centre: 1 }
    zeroad: storehouse
    cost: { total: 420, factor: 1.28 }
    time: { base: 500, factor: 1.3 }
    effects: { storage: { resources: [wood, stone, metal], curve: { base: 1200, factor: 1.28, round: 100 } } }
  - id: farmstead
    name: Farmstead
    description: Stores food.
    slot: center
    max_level: 20
    unique: false
    requires: { civic_centre: 1 }
    zeroad: farmstead
    cost: { total: 270, factor: 1.28 }
    time: { base: 450, factor: 1.3 }
    effects: { storage: { resources: [food], curve: { base: 1200, factor: 1.28, round: 100 } } }
  - id: house
    name: House
    description: Families hide part of every resource from raiders.
    slot: center
    max_level: 10
    unique: false
    zeroad: house
    cost: { total: 130, factor: 1.28 }
    time: { base: 260, factor: 1.3 }
    population: 0
    effects: { hide: { base: 200, factor: 1.23, round: 10 } }
  - id: rally_point
    name: Rally Point
    description: Where troops gather before marching out.
    slot: center
    max_level: 20
    cost: { total: 430, mix: { food: 70, wood: 110, stone: 160, metal: 90 }, factor: 1.28 }
    time: { base: 400, factor: 1.3 }
  - id: barracks
    name: Barracks
    description: Trains infantry. Higher levels train faster.
    slot: center
    max_level: 20
    unique: false
    requires: { civic_centre: 3, rally_point: 1 }
    zeroad: barracks
    cost: { total: 730, factor: 1.28 }
    time: { base: 900, factor: 1.3 }
    population: 4
    effects: { train_speed: { base: 1.0, factor: 0.94 } }
  - id: stable
    name: Stable
    description: Trains cavalry, chariots and war elephants.

  # Overlords may levy auxiliaries in a vassal with a garrison: the vassal's own troops, trained in its
  # buildings but paid for by the overlord, stationed in the garrison (they count against its room).
  # Every 100 levied anger the city by `mood_per_100` for `mood_hours` (at most `mood_max`).
  # Should the city break free, its auxiliaries go home to it: they join the freed city's army.
  auxiliaries: { cost: 1.25, mood_per_100: -3, mood_max: -15, mood_hours: 24 }
  # Archaeology: every site remembers what stood on it. Digging an empty site or a ruin uncovers its
  # top layer (a pulled-down building, a lost overlord's embassy) or, below everything, the remains of
  # the people who lived here before history (`ancient_chance` of the sites). Each layer gives a find,
  # graded common, fine or exceptional. Finds are shown in a city's temples (`display.per_level` per
  # temple level) and add their culture there. GET /api/v1/finds is the public catalogue.
  archaeology:
    cost: { food: 400, wood: 300, stone: 200, metal: 100 }
    hours: 2
    ancient_chance: 0.4
    display: { building: temple, per_level: 1 }
    grades:
      common: { chance: 0.65, culture: 1 }
      fine: { chance: 0.28, culture: 3 }
      exceptional: { chance: 0.07, culture: 8 }
    ancient:
      - { id: neolithic, name: Neolithic village, age: c. 5000 BC, finds: [flint sickle, clay figurine, polished stone axe, impressed ware bowl, obsidian blade, loom weights] }
      - { id: bronze, name: Bronze Age settlement, age: c. 1600 BC, finds: [bronze dagger, stirrup jar, clay tablet, gold signet ring, boar's tusk helmet, faience beads] }
      - { id: iron, name: Early Iron Age hamlet, age: c. 900 BC, finds: [biconical urn, bronze fibula, bronze razor, spindle whorls, iron knife, painted krater] }
    # Beating a barbarian camp: 5% per camp level (at most 30%) to bring home one of finds.camp.
    camp_find_chance: 0.05
    camp_find_max: 0.3
    finds:
      camp: [gold torque, bronze war trumpet, looted silver cup, painted shield boss, amber necklace, chieftain's drinking horn, stolen temple offering, iron sword with a bent blade]
      embassy: [envoy's seal, inscribed treaty stele, gift amphora, diplomatic tablet]
      ruin: [envoy's seal, inscribed treaty stele, broken statue of a foreign king, gift amphora]
      exchange: [foreign coin hoard, bronze scale weights, merchant's seal]
      cultural_exchange: [inscribed lyre, mosaic fragment, theatre mask]
      garrison: [foreign helmet, sling bullets, soldier's grave stele]
      temple: [votive statuette, altar fragment, offering bowl, bronze tripod]
      market: [coin hoard, set of weights, stamped amphora handles]
      barracks: [helmet, spearheads, bronze greave]
      stable: [bronze bit, chariot fitting, horse figurine]
      fortress: [sword hilt, bronze shield boss, arrowheads]
      house: [cooking pot, oil lamp, bone hairpins, child's toy]
      storehouse: [storage jar, seal impression, grain measure]
      farmstead: [sickle blade, millstone, storage jar]
      university: [inscribed tablet, bronze stylus, astronomical disc]
      gardens: [garden statue, carved fountain spout, terracotta planter]
      baths: [strigil, perfume flask, painted tile]
      amphitheatre: [gladiator's helmet, ticket token, theatre mask]
      default: [potsherds, roof tiles, oil lamp, bronze pin]
  # Governors: each rules one city, own or a vassal's (where the overlord's governor is a prefect and
  # sends the city's own away). Hire them from the candidates offered (refreshed every `refresh_hours`);
  # each new one costs `hire` x (1 + governors already in service). At most one per city you hold or rule.
  # They travel at `speed` tiles/hour. Their two traits shape the city (see `traits`: contentment points,
  # multipliers on unrest, calm, crowding, tribute anger and agitators, production and defense).
  governors:
    hire: { food: 1500, wood: 1500, stone: 1000, metal: 2000 }
    candidates: 3
    refresh_hours: 24
    speed: 8
    prefect: -3
    traits:
      just: { name: Just, text: "Fair judgements: the people trust the governor.", contentment: 4 }
      harsh: { name: Harsh, text: "Order by the rod. Unrest grows slowly; nobody smiles.", unrest: 0.6, contentment: -3 }
      beloved: { name: Beloved, text: "Every feast in person. Anger fades quickly.", calm: 1.5, contentment: 2 }
      orator: { name: Orator, text: "Speeches in the agora. Agitators find no ears; crowds stay calm.", agitators: 0.5, size: 0.7 }
      steward: { name: Able steward, text: "Granaries counted, roads mended.", production: 0.06 }
      corrupt: { name: Corrupt, text: "Skims a little off everything.", production: -0.04, contentment: -2 }
      soldier: { name: Old soldier, text: "Walls manned, watches kept.", defense: 0.12 }
      lax: { name: Lax, text: "Lets things slide. Popular, until it is not.", unrest: 1.3, contentment: 3 }
      diplomat: { name: Diplomat, text: "Makes the tribute easier to bear.", tribute: 0.6 }
    names:
      athen: [Kleon, Nikias, Lysandros, Aristeides, Thrasyboulos, Demosthenes, Phokion, Konon, Iphikrates, Chabrias]
      spart: [Brasidas, Gylippos, Kallikratidas, Archidamos, Agis, Kleomenes, Lichas, Eteonikos]
      mace: [Antipatros, Parmenion, Krateros, Perdikkas, Polyperchon, Kassandros, Lysimachos, Peukestas]
      ptol: [Sostratos, Kallikrates, Apollonios, Herakleides, Sosibios, Agathokles, Tlepolemos]
      sele: [Antiochos, Achaios, Molon, Zeuxis, Hermeias, Nikanor, Timarchos, Bakchides]
      rome: [Gaius Flaminius, Marcus Claudius, Quintus Fabius, Lucius Aemilius, Publius Cornelius, Gnaeus Domitius, Titus Quinctius, Aulus Postumius]
      cart: [Hanno, Bomilcar, Gisgo, Himilco, Mago, Hasdrubal, Adherbal, Carthalo]
      iber: [Indibilis, Mandonius, Istolatios, Orisson, Allucius, Edeco, Culchas]
      gaul: [Ambiorix, Commios, Dumnorix, Diviciacos, Lucterios, Indutiomaros, Cingetorix]
      brit: [Cassivellaunos, Tasciovanos, Addedomaros, Dubnovellaunos, Mandubracios, Cunobelinos]
      germ: [Maroboduus, Segestes, Inguiomerus, Catumerus, Italicus, Flavus]
      achae: [Tissaphernes, Pharnabazos, Datames, Mazaios, Orontes, Hydarnes, Artabazos, Megabyzos]
      maur: [Kautilya, Rajuka, Pradeshika, Mahamatra, Bindusara, Devapala, Somasharma]
      kush: [Arikakhatani, Natakamani, Akinidad, Sherkarer, Tanyidamani, Adikhalamani]
      han: [Xiao He, Cao Can, Zhang Liang, Chen Ping, Zhou Bo, Jia Yi, Chao Cuo, Dong Zhongshu]
  # Merchants: one per market level, each carrying `carry`, travelling `speed` tiles per hour.
  market: { building: market, carry: 1000, speed: 12 }
  # Scouts get through when they number at least defenders / `stealth`; otherwise they are caught.
  scouting:
    stealth: 10
    # Missions: scouts must outnumber `difficulty` times as many defenders.
    missions:
      sabotage: { difficulty: 2, requires: { barracks: 3 } }
      steal: { difficulty: 3, requires: { university: 1 } }
      incite: { difficulty: 2, unrest: 40, requires: { temple: 1 } }
  # One hero per player. Battles give experience; every level gives a point to spend.
  heroes: { xp_base: 100, attack_per_point: 0.03, defense_per_point: 0.03, production_per_point: 0.02, revive: 14400, speed: 10 }
  # Barbarian camps to raid: troops grow back after `regen` seconds; heroes gain extra experience there.
  camps: { count: 12, min_distance: 4, max_distance: 16, max_level: 5, troops_per_level: 12, regen: 3600, loot_per_level: 1500 }
  # The first player to finish the last level of the wonder wins the world.
  wonder: { building: wonder }
  # Temples give favor to call on the gods.
  gods:
    building: temple
    favor_per_level: 2      # per hour, at world speed 1
    max_favor: 500
    powers:
      blessing: { name: Blessing of the harvest, cost: 120, boost: 0.25, hours: 2, description: "+25% production in this city for 2 hours." }
      shield: { name: Divine shield, cost: 150, defense: 0.3, hours: 2, description: "+30% defense in this city for 2 hours." }
      fury: { name: Battle fury, cost: 100, attack: 0.2, description: "+20% attack for the next army sent from this city." }
      wrath: { name: Wrath of the gods, cost: 200, destroy: 0.15, target: true, description: "A foreign city within 20 tiles loses 15% of its stores." }
  # Great buildings: anyone may contribute resources; a level is finished when contributions reach its cost.
  great_buildings: { buildings: [great_theatre, great_forge], reward: 0.5 }
  # Techs that make this city's troops better soldiers (fraction added to attack and defense).
  ranks: { drill: 0.1, veterans: 0.1 }
  # Techs that make a city's citizens fight when it is attacked (soldiers per citizen), as the people's spearmen.
  militia: { techs: { civil_servants: 1.0 } }
  vacation: { min_hours: 12, max_days: 14 }
  quests:
    - { id: woodline, title: Timber, text: Raise a woodline to level 2., goal: { building: woodline, level: 2 }, reward: { food: 200, wood: 200, stone: 150, metal: 100 }, hint: "Tap a woodline on the edge of your city and upgrade it. Woodlines, quarries, mines and fields make your resources.", focus: { building: woodline } }
    - { id: civic_3, title: Village elders, text: Raise the Civic Centre to level 3., goal: { building: civic_centre, level: 3 }, reward: { food: 400, wood: 400, stone: 300, metal: 300 }, hint: "Select the Civic Centre in the middle of the city and upgrade it. A bigger centre opens new building sites.", focus: { building: civic_centre } }
    - { id: barracks, title: A place to train, text: Build barracks., goal: { building: barracks, level: 1 }, reward: { food: 300, wood: 300, stone: 300, metal: 400 }, hint: "Pick an empty building site and build Barracks there.", focus: { site: true, building: barracks } }
    - { id: army, title: The first company, text: Have 20 troops at home., goal: { units: 20 }, reward: { food: 800, wood: 500, stone: 500, metal: 500 }, hint: "Select the Barracks and train infantry. Troops eat food, so keep the fields growing.", focus: { building: barracks } }
    - { id: camp, title: Clear the hills, text: Beat a barbarian camp., goal: { stat: camps_beaten, value: 1 }, reward: { food: 800, wood: 800, stone: 800, metal: 800 }, hint: "Open the map, pick a barbarian camp (⚔) near you and raid it from the rally point.", focus: { screen: map } }
    - { id: market, title: Merchants, text: Build a market., goal: { building: market, level: 1 }, reward: { food: 600, wood: 600, stone: 400, metal: 400 }, hint: "Build a Market on a free site. Merchants carry goods to other cities.", focus: { site: true, building: market } }
    - { id: temple, title: The gods, text: Build a temple., goal: { building: temple, level: 1 }, reward: { food: 700, wood: 700, stone: 500, metal: 500 }, hint: "Build a Temple. It brings culture, happier people and favor for divine powers.", focus: { site: true, building: temple } }
    - { id: hero, title: A hero rises, text: Bring your hero to level 2., goal: { hero_level: 2 }, reward: { food: 1000, wood: 1000, stone: 1000, metal: 1000 }, hint: "Open Hero, choose one of your people's great figures, and send them with an attack or a raid.", focus: { screen: hero } }
    - { id: alliance, title: Sworn friends, text: Join or found an alliance., goal: { alliance: true }, reward: { food: 1000, wood: 1000, stone: 1000, metal: 1000 }, hint: "Open Alliance to found one or accept an invitation. Members cannot attack each other.", focus: { screen: alliance } }
    - { id: town, title: Town Phase, text: Raise the Civic Centre to level 5., goal: { building: civic_centre, level: 5 }, reward: { food: 1500, wood: 1500, stone: 1200, metal: 1200 }, hint: "Keep raising the Civic Centre. At level 5 your village becomes a town.", focus: { building: civic_centre } }
    - { id: culture, title: Culture, text: Reach 100 culture., goal: { culture: 100 }, reward: { food: 2000, wood: 2000, stone: 2000, metal: 2000 }, hint: "Temples, theatres and the university add culture; culture keeps your people content.", focus: { building: temple } }
    - { id: city, title: City Phase, text: Raise the Civic Centre to level 10., goal: { building: civic_centre, level: 10 }, reward: { food: 4000, wood: 4000, stone: 3000, metal: 3000 }, hint: "At level 10 the Civic Centre makes a city, with more sites and more builders.", focus: { building: civic_centre } }
    - { id: colony, title: Ver sacrum, text: Found a colony., goal: { villages: 2 }, reward: { food: 5000, wood: 5000, stone: 5000, metal: 5000 }, hint: "Every 10 levels of the Civic Centre allow a ver sacrum: select it and send migrants to found a colony.", focus: { building: civic_centre } }
    - { id: veteran, title: Veteran, text: Win 5 battles., goal: { stat: battles_won, value: 5 }, reward: { food: 2000, wood: 1500, stone: 1000, metal: 2000 }, hint: "Win battles: raid camps, or attack rivals who are no longer protected.", focus: { screen: rally } }
  # Defenders fight better at night (server time, UTC).
  night: { start: 0, end: 6, defense: 0.25 }
  # How content each city is: culture, food, size, tribute, defeats, moods. Happy cities produce
  # more, unhappy ones less; an unhappy vassal gathers unrest and rises up at `rebel_at`.
  # Buildings with a `contentment` effect (gardens, baths, amphitheatre) add up to `amenities_max`.
  # `techs` researched in a city change its politics: `contentment` points, multipliers on unrest growth (`unrest`),
  # calming (`calm`), the crowded-city penalty (`size`), tribute anger (`tribute`) and agitators (`agitators`),
  # and `rebel_below`, added to the threshold under which unrest gathers.
  contentment:
    base: 5
    culture_divisor: 5
    culture_max: 20
    amenities_max: 30
    food_surplus: 5
    food_deficit: -20
    size_per_level: -0.5
    tribute: -15
    colony: -5
    rebel_below: -10
    rebel_at: 100
    techs:
      political_thought: { contentment: 3, unrest: 0.75 }
      rhetoric: { size: 0.5, agitators: 0.5 }
      law_code: { rebel_below: -5, calm: 1.5 }
      citizenship: { contentment: 5, tribute: 0.5, unrest: 0.75 }
  # One government for all of a player's cities; changing brings a spell of anarchy.
  governments:
    default: chiefdom
    anarchy_hours: 6
    cooldown_hours: 48
    anarchy: { contentment: -15, production: { all: -0.1 } }
    list:
      chiefdom: { name: Chiefdom, text: "The old ways: the elders advise, the chief decides. No strengths, no weaknesses." }
      monarchy: { name: Monarchy, text: "A king and his court. Walls are manned and people feel safe.", defense: 0.1, contentment: 5 }
      republic: { name: Republic, text: "Citizens vote and trade. Merchants thrive; soldiers grumble.", production: { all: 0.05 }, trade_speed: 0.25, attack: -0.05 }
      tyranny: { name: Tyranny, text: "One man rules by fear. Armies are fierce; people are not happy.", attack: 0.15, march_speed: 0.1, contentment: -10 }
      theocracy: { name: Theocracy, text: "The priests rule in the gods' name. Temples overflow with favor.", favor: 0.5, contentment: 5, production: { metal: -0.1 } }
      oligarchy: { name: Oligarchy, text: "A few great families. Fields and workshops are well run.", production: { food: 0.1, wood: 0.05 }, contentment: -3 }
  # A year has four seasons of `hours` each (at world speed). Winter is hard.
  seasons:
    hours: 24
    list:
      - { id: spring, name: Spring, production: { food: 0.1 }, contentment: 3 }
      - { id: summer, name: Summer, production: { food: 0.05, stone: 0.05 }, travel: 0.9 }
      - { id: autumn, name: Autumn, production: { food: 0.2, wood: 0.1 }, contentment: 3 }
      - { id: winter, name: Winter, production: { food: -0.25, wood: -0.05 }, travel: 1.25, contentment: -5 }
  # Once a year, in summer, the games: everyone may enter each contest once.
  festival:
    name: Olympic Games
    text: "Athletes, chariots and poets from every city meet for the summer games. The winners bring home gifts and glory."
    season: summer
    contests:
      race: { name: Chariot race, kind: resources, resources: [wood, metal], text: "Offer timber and metal for the finest chariots; the most generous city wins." }
      wrestling: { name: Wrestling, kind: army, text: "The strength of the troops at home in the city you enter from." }
      poetry: { name: Poetry, kind: culture, text: "The culture of all your cities." }
    prizes:
      - { resources: { all: 6000 }, favor: 100, contentment: 15 }
      - { resources: { all: 3000 }, favor: 50, contentment: 10 }
      - { resources: { all: 1500 }, favor: 25, contentment: 5 }
  # Omens: now and then a city must make a choice (see the built-in events in the server).

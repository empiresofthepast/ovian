tribes:
- id: athen
  name: Athenians
  description: The Greek city-state of Athens is remembered as a famed center for the arts, learning, and philosophy,
    as well as one of the earliest forms of democracy. That wasn't to say that they weren't warriors.
- id: spart
  name: Spartans
  description: Sparta was a prominent city-state in Ancient Greece, and its dominant military power started in the
    7th century BC.
- id: mace
  name: Macedonians
  description: Macedonia was an ancient Greek kingdom, centered in the northeastern part of the Greek peninsula.
- id: ptol
  name: Ptolemies
  description: The Ptolemaic dynasty was a Macedonian Greek royal family which ruled the Ptolemaic Empire in Egypt
    during the Hellenistic period. Their rule lasted for 275 years, from 305 BC to 30 BC.
- id: sele
  name: Seleucids
  description: The Macedonian-Greek dynasty that ruled most of Alexander's former empire.
- id: rome
  name: Romans
  description: The Romans controlled one of the largest empires of the ancient world, stretching at its peak from
    southern Scotland to the Sahara Desert, and containing between 60 million and 80 million inhabitants, one quarter
    of the Earth's population at that time.
- id: cart
  name: Carthaginians
  description: Carthage, a city-state in modern-day Tunisia, was a formidable force in the western Mediterranean,
    eventually taking over much of North Africa and modern-day Spain in the third century BC.
- id: iber
  name: Iberians
  description: The Iberians were a people of mysterious origins and language, with a strong tradition of horsemanship
    and metalworking. A relatively peaceful culture, they usually fought in other's battles only as mercenaries.
- id: gaul
  name: Gauls
  description: The Gauls were the Celtic tribes of continental Europe. Dominated by a priestly class of Druids,
    they featured a sophisticated culture of advanced metalworking, agriculture, trade and even road engineering.
- id: brit
  name: Britons
  description: The Britons were the Celtic tribes of the British Isles. Using chariots, longswordsmen and powerful
    melee soldiers, they staged fearsome revolts against Rome to protect their customs and interests.
- id: germ
  name: Germans
  description: The largest migration in Europe of this period was that of the Cimbri people. The Cimbri were a large
    group of Germanic peoples originally from the Jutland region, in the north of modern-day Denmark.
- id: achae
  name: Achaemenids
  description: The Achaemenid Empire, also known as the first Persian Empire, was one of the greatest empires of
    antiquity, stretching at its zenith from the Indus Valley in the east to Greece in the west.
- id: maur
  name: Mauryas
  description: Founded in 322 BC by Chandragupta Maurya, the Mauryan Empire was the first to rule most of the Indian
    subcontinent, and was one of the largest and most populous empires of antiquity.
- id: kush
  name: Kushites
  description: The Kingdom of Kush was an African kingdom located at the confluences of the Blue Nile, White Nile,
    and River Atbara, in present-day Sudan.
- id: han
  name: Han
  description: The Han dynasty was the second imperial dynasty of China.
